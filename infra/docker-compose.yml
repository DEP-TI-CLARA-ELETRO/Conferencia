name: conferencia

services:
  mongo:
    image: mongo:7
    container_name: conferencia_mongo
    restart: unless-stopped
    # Se a porta 27017 já estiver em uso no host, defina MONGO_PORT=27018 no .env
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - conferencia_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  conferencia_mongo_data:
